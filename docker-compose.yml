services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wisekew
      POSTGRES_PASSWORD: wisekew
      POSTGRES_DB: wisekew
    ports:
      - "5432:5432"
    volumes:
      - wisekew_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisekew"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wisekew_pgdata:
